name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Generate the Prisma client for Postgres; no live DB is needed for these steps.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      NEXTAUTH_SECRET: ci-only-secret
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  smoke:
    # Boots the app against a real Postgres with demo data and checks the health endpoint.
    runs-on: ubuntu-latest
    needs: verify
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aiv
          POSTGRES_PASSWORD: aiv
          POSTGRES_DB: aiv
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aiv" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://aiv:aiv@localhost:5432/aiv
      NEXTAUTH_SECRET: ci-only-secret
      NEXTAUTH_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:generate && npm run db:push && npm run db:seed
      - run: npm run build
      - name: Start and probe
        run: |
          (npm start > web.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://localhost:3000/api/health && exit 0; sleep 2; done
          cat web.log; exit 1
