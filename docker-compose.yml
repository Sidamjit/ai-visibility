# Client-hosted, single-tenant deployment: Postgres + web + worker on the
# CLIENT's own server/VM. File content is read by the worker in memory and is
# never stored or sent anywhere. Outbound traffic: Microsoft Graph only (plus
# your own LLM endpoint if you enable one). No vendor telemetry unless you set
# TELEMETRY_ENABLED=true. See docs/DEPLOYMENT.md.
#
#   cp .env.example .env   # set NEXTAUTH_SECRET at minimum
#   docker compose up --build
#   open http://localhost:3000   (demo users: it@ / exec@ / manager@demo.local, password demo1234)
#
# Set SEED_DEMO=false for a real client deployment (then use the worker CLI to create the tenant).
# Optional local LLM (Ollama, never leaves the host):  docker compose --profile local-llm up
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aiv
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aiv}
      POSTGRES_DB: aiv
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aiv -d aiv']
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: create/update the schema, optionally seed the demo tenant.
  setup:
    build: { context: ., target: worker }
    env_file: { path: .env, required: false }
    environment:
      DATABASE_URL: postgresql://aiv:${POSTGRES_PASSWORD:-aiv}@postgres:5432/aiv
    command: sh -c 'npm run db:push && if [ "${SEED_DEMO:-true}" = "true" ]; then npm run db:seed; fi'
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'

  web:
    build: { context: ., target: web }
    env_file: { path: .env, required: false }
    environment:
      DATABASE_URL: postgresql://aiv:${POSTGRES_PASSWORD:-aiv}@postgres:5432/aiv
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET in .env (openssl rand -base64 32)}
      SHOW_DEMO_LOGINS: ${SEED_DEMO:-true}
      TELEMETRY_ENABLED: ${TELEMETRY_ENABLED:-false}
    ports:
      # Bind to localhost by default; put your reverse proxy / TLS in front.
      - '${WEB_BIND:-127.0.0.1}:3000:3000'
    depends_on:
      setup: { condition: service_completed_successfully }

  worker:
    build: { context: ., target: worker }
    env_file: { path: .env, required: false }
    environment:
      DATABASE_URL: postgresql://aiv:${POSTGRES_PASSWORD:-aiv}@postgres:5432/aiv
      TELEMETRY_ENABLED: ${TELEMETRY_ENABLED:-false}
    # Content is processed in memory; give extraction headroom.
    mem_limit: ${WORKER_MEM_LIMIT:-2g}
    depends_on:
      setup: { condition: service_completed_successfully }

  # Optional: a local model for LLM classification / policy drafting.
  # Then set LLM_PROVIDER=openai-compatible LLM_BASE_URL=http://ollama:11434/v1 LLM_MODEL=llama3.1:8b
  # and pull the model once:  docker compose exec ollama ollama pull llama3.1:8b
  ollama:
    image: ollama/ollama:latest
    profiles: ['local-llm']
    volumes:
      - ollama:/root/.ollama

volumes:
  pgdata:
  ollama:
